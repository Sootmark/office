[package]
name = "sootmark-office"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Office document metadata for forensics: authors, last saved by, created, saved and printed times, edit time, counts, company and template, from 97-2003 compound files (OLE property sets) and Office Open XML (docx, xlsx, pptx)."
license = "MIT OR Apache-2.0"
repository = "https://github.com/Sootmark/office"
homepage = "https://sootmark.com"
keywords = ["forensics", "dfir", "office", "docx", "metadata"]
# Sources only: test fixtures stay in the repository.
include = ["/src", "/README.md", "/LICENSE-APACHE", "/LICENSE-MIT"]

[lib]
name = "office"

[dependencies]
common = { package = "sootmark-common", version = "0.3.7" }
shell = { package = "sootmark-shell", version = "0.2.2" }
zip = { package = "sootmark-zip", version = "0.4.0" }

[dev-dependencies]
proptest = "1"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
